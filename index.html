<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--link rel="preconnect" href="https://fonts.googleapis.com" /-->
    <!--link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /-->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Favicons (consistent names + cache-busting) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo16x16.png?v=5" />
    <link rel="apple-touch-icon" href="/logo180x180.png?v=5" sizes="180x180" />
    <!-- Safari pinned tab (monochrome mask) -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=5" color="#6837F4" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskitin — Coordinate teams and tasks clearly</title>
    <meta name="description" content="Public and personal tasks, member-level metrics, role-based permissions, and a clean workflow so nothing gets lost. Fast, simple, and built for focus." />
    <link rel="canonical" href="https://taskitin.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6837F4" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taskitin" />
    <meta property="og:title" content="Taskitin — Coordinate teams and tasks clearly" />
    <meta property="og:description" content="Collaborate on public and personal tasks, track member statistics, and keep a clean workflow so nothing gets lost." />
    <meta property="og:url" content="https://taskitin.com/" />
    <meta property="og:image" content="/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taskitin — Coordinate teams and tasks clearly" />
    <meta name="twitter:description" content="Public and personal tasks, member-level metrics, and role-based permissions." />
    <meta name="twitter:image" content="/og-image.png?v=1" />

    <!-- JSON-LD Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Taskitin",
        "url": "https://taskitin.com/",
        "logo": "/logo.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
